<svg xmlns="http://www.w3.org/2000/svg" viewBox="9 6 50 45" fill="none">
  <!-- Top Left 360° Rotational Arc Mark -->
  <path
    d="M 22 13 A 22 22 0 0 1 33 9"
    stroke="#000000"
    stroke-width="3.2"
    stroke-linecap="round"
  />

  <!-- Top Right 360° Arrowhead Rotation Mark -->
  <path
    d="M 46 11 A 22 22 0 0 1 54 22"
    stroke="#000000"
    stroke-width="3.2"
    stroke-linecap="round"
  />
  <polygon
    points="51,25 58,16 47,15"
    fill="#000000"
  />

  <!-- House Pitched Roof -->
  <path
    d="M 13 27.5 L 32 15 L 51 27.5"
    stroke="#000000"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Rounded Video Screen / Spatial Room Body Box -->
  <rect
    x="18"
    y="27"
    width="28"
    height="20"
    rx="4.5"
    stroke="#000000"
    stroke-width="3.8"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Centered Solid Play Triangle Mark (▶) -->
  <polygon
    points="28.5,31 40.5,37 28.5,43"
    fill="#000000"
  />
</svg>
