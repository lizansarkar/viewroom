<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="vrFaviconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>

  <!-- High-contrast rounded background tile -->
  <rect width="64" height="64" rx="14" fill="url(#vrFaviconGrad)" />

  <!-- Top Left 360° Rotational Arc Mark -->
  <path
    d="M 22 13 A 22 22 0 0 1 33 9"
    stroke="#ffffff"
    stroke-width="2.6"
    stroke-linecap="round"
  />

  <!-- Top Right 360° Arrowhead Rotation Mark -->
  <path
    d="M 46 11 A 22 22 0 0 1 54 22"
    stroke="#ffffff"
    stroke-width="2.6"
    stroke-linecap="round"
  />
  <polygon
    points="52,24 57,17 48,16"
    fill="#ffffff"
  />

  <!-- House Pitched Roof -->
  <path
    d="M 14 27.5 L 32 15.5 L 50 27.5"
    stroke="#ffffff"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Rounded Video Screen / Spatial Room Body Box -->
  <rect
    x="18"
    y="27.5"
    width="28"
    height="20"
    rx="4"
    stroke="#ffffff"
    stroke-width="3"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Centered Solid Play Triangle Mark (▶) -->
  <polygon
    points="29,31.5 40,37.5 29,43.5"
    fill="#ffffff"
  />
</svg>
