<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <style>
    :root {
      --logo-color: #0f172a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --logo-color: #ffffff;
      }
    }
    .stroke-mark {
      stroke: var(--logo-color);
    }
    .fill-mark {
      fill: var(--logo-color);
    }
  </style>

  <!-- Top Left 360° Rotational Arc Mark -->
  <path
    class="stroke-mark"
    d="M 22 13 A 22 22 0 0 1 33 9"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <!-- Top Right 360° Arrowhead Rotation Mark -->
  <path
    class="stroke-mark"
    d="M 46 11 A 22 22 0 0 1 54 22"
    stroke-width="2.5"
    stroke-linecap="round"
  />
  <polygon
    class="fill-mark"
    points="52,24 57,17 48,16"
  />

  <!-- House Pitched Roof -->
  <path
    class="stroke-mark"
    d="M 14 27.5 L 32 15.5 L 50 27.5"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Rounded Video Screen / Spatial Room Body Box -->
  <rect
    class="stroke-mark"
    x="18"
    y="27.5"
    width="28"
    height="20"
    rx="4"
    stroke-width="3"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Centered Solid Play Triangle Mark (▶) -->
  <polygon
    class="fill-mark"
    points="29,31.5 40,37.5 29,43.5"
  />
</svg>
